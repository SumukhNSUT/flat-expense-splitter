name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Build and Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: flatmate_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/flatmate_ledger
      TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/flatmate_ledger_test
      VITE_API_URL: http://localhost:4000/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare test database
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d postgres -c "CREATE DATABASE flatmate_ledger_test;"

      - name: Run type check & production builds
        run: npm run build

      - name: Run automated test suite (Unit & PostgreSQL-backed integration)
        run: npm run test
