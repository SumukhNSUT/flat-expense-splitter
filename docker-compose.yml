services:
  postgres:
    image: postgres:16-alpine
    container_name: flatmate_ledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: flatmate_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flatmate_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
